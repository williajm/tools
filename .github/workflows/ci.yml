name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The per-tool index.html files are generated from the registry. If a tool
      # was added without re-running the generator, the committed pages are stale
      # and the deployed site would be missing a page.
      - name: Check generated pages match the registry
        run: |
          npm run gen:pages
          # --porcelain rather than `git diff`, so a page for a newly added tool
          # that was never committed shows up as untracked instead of passing.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated pages are out of date. Run 'npm run gen:pages' and commit the result."
            git status --porcelain
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
