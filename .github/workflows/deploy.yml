name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway: a half-published site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - run: npm ci

      # Deploying a broken build is the one failure mode with no undo, so the
      # tests run here too rather than trusting the CI workflow to have finished.
      - name: Unit tests
        run: npm test

      - name: Build
        # configure-pages reports the subpath the site is served from — '/tools'
        # for a project page, empty for a custom domain. vite.config.ts
        # normalises the slashes either way.
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # The end-to-end suite is the only layer that sees the CSP, since it drives
      # the built site in a real browser. Unit tests run in Node, which has no CSP
      # at all — that is exactly how a validator relying on `new Function` shipped
      # completely broken once. Skipping this here would let the same class of
      # regression reach production even while CI went red beside it.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          # Serve the build produced above rather than building a third time.
          PLAYWRIGHT_SKIP_BUILD: '1'
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
