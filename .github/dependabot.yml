version: 2

# Security updates only for npm and GitHub Actions.
# npm uses the repository's enabled Dependabot security updates directly.
# Actions keep their SHA pins, with routine version-update PRs disabled below.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: ci
